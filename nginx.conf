# generated 2026-01-12, Mozilla Guideline v5.7, nginx 1.27.3, OpenSSL 3.5.1, modern config, no OCSP
# https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=modern&openssl=3.5.1&ocsp=false&guideline=5.7

events {}

http {

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        ssl_certificate /etc/letsencrypt/live/horde.silvereyecreative.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/horde.silvereyecreative.com/privkey.pem;

        location / {
            proxy_http_version 2;
            proxy_pass http://horde_server:13342;
        }

        # HSTS (ngx_http_headers_module is required) (63072000 seconds)
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # modern configuration
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;

    # uncomment to enable if ssl_protocols includes TLSv1.2 or earlier;
    # see also ssl_session_ticket_key alternative to stateful session cache
    #ssl_session_timeout 1d;
    #ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions

    # HSTS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Special case for renewing the ssl certificate.
        location /.well-known/acme-challenge {
            alias /var/acme-challenge;
        }

        # Otherwise redirect.
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
