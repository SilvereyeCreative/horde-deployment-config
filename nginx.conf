# generated 2026-01-12, Mozilla Guideline v5.7, nginx 1.27.3, OpenSSL 3.5.1, modern config, no OCSP
# https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=modern&openssl=3.5.1&ocsp=false&guideline=5.7

events {}

http {

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        ssl_certificate /etc/letsencrypt/live/horde.silvereyecreative.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/horde.silvereyecreative.com/privkey.pem;

        location / {
            grpc_pass grpc://horde_server:13342;

            grpc_buffer_size 16k;

            grpc_set_header Host $http_host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;

            grpc_send_timeout 180s;
            grpc_read_timeout 180s;
            #client_body_timeout 180s;
        }

        # HSTS (ngx_http_headers_module is required) (63072000 seconds)
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # intermediate configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # see also ssl_session_ticket_key alternative to stateful session cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions

    # curl https://ssl-config.mozilla.org/ffdhe2048.txt > /path/to/dhparam
    ssl_dhparam dhparam.txt;

    # HSTS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Special case for renewing the ssl certificate.
        location /.well-known/acme-challenge {
            alias /var/acme-challenge;
        }

        # Otherwise redirect.
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
