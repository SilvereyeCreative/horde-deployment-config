services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    read_only: true
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:z
      - ../html/.well-known/acme-challenge:/var/acme-challenge:z
      - nginx_cache:/var/cache/nginx
      - nginx_pid:/var/run

volumes:
  nginx_cache:
    driver: local
  nginx_pid:
    driver: local
